<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--lisnk de conexion con boostrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--lisnk de conexion con google fonts-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!--lisnk de conexion con css porpio-->
    <link rel="stylesheet" href="../styles/styles_nav/Nav.css">
    <link rel="stylesheet" href="../styles/Menu_hamburguesa/menu.css">
    <link rel="stylesheet" href="../styles/Footer/Footer.css">
</head>

<body>


    <!-- Header con menú hamburguesa -->
    <header>
        <!-- Logo y nombre de la marca -->
        <div class="brand-container">
            <div class="logo">
                <img src="../images/logo.png" alt="ElegantCut Barbería" class="logo-img">
            </div>
            <div class="brand-name">
                <span class="brand-text">ELEGANTCUT</span>
            </div>
        </div>

        <!-- Contenedor de íconos visible en escritorio -->
        <div class="button-container desktop-icons">
            <a href="index.html" class="button nav-button" aria-label="Inicio">
                <i class="bi bi-house-door"></i>
                <span class="nav-label">Inicio</span>
            </a>
            <a href="reseñas.html" class="button nav-button" aria-label="Reseñas">
                <i class="bi bi-star"></i>
                <span class="nav-label">Reseñas</span>
            </a>
            <a href="../page/profile.html" class="button nav-button" aria-label="Perfil">
                <i class="bi bi-person"></i>
                <span class="nav-label">Perfil</span>
            </a>
            <a href="../page/servicios_dama.html" class="button nav-button" aria-label="Servicios">
                <i class="bi bi-scissors"></i>
                <span class="nav-label">Servicios</span>
            </a>
            <!-- Nuevo icono para Barberos -->
            <a href="../page/barberos.html" class="button nav-button" aria-label="Barberos">
                <i class="bi bi-person-badge"></i>
                <span class="nav-label">Barberos</span>
            </a>
            <a href="../page/pqrs.html" class="button nav-button" aria-label="pqrs">
                <i class="bi bi-question-circle"></i>
                <span class="nav-label">Pqrs</span>
            </a>
        </div>

        <!-- Botón abrir menú hamburguesa (solo visible en móvil) -->
        <button id="abrir" class="abrir-menu" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>

        <!-- Menú hamburguesa -->
        <nav class="nav" id="nav">
            <!-- Botón cerrar -->
            <button id="cerrar" class="cerrar-menu" aria-label="Cerrar menú">
                <i class="bi bi-x"></i>
            </button>

            <!-- Logo en menú hamburguesa -->
            <div class="mobile-brand">
                <img src="../images/logo.png" alt="ElegantCut Barbería" class="mobile-logo">
                <span class="mobile-brand-text">ELEGANTCUT</span>
            </div>

            <!-- Íconos del menú hamburguesa -->
            <div class="menu-icons-container">
                <a href="../page/index.html" class="button menu-nav-button">
                    <i class="bi bi-house-door"></i>
                    <span class="menu-nav-label">Inicio</span>
                </a>
                <a href="../page/reseñas.html" class="button menu-nav-button">
                    <i class="bi bi-star"></i>
                    <span class="menu-nav-label">Reseñas</span>
                </a>
                <a href="../page/profile.html" class="button menu-nav-button">
                    <i class="bi bi-person"></i>
                    <span class="menu-nav-label">Mi Perfil</span>
                </a>
                <a href="../page/servicios_dama.html" class="button menu-nav-button">
                    <i class="bi bi-scissors"></i>
                    <span class="menu-nav-label">Servicios</span>
                </a>
                <!-- Nuevo icono para Barberos en menú móvil -->
                <a href="../page/barberos.html" class="button menu-nav-button">
                    <i class="bi bi-person-badge"></i>
                    <span class="menu-nav-label">Barberos</span>
                </a>
                <a href="../page/pqrs.html" class="button nav-button" aria-label="pqrs">
                   <i class="bi bi-question-circle"></i>
                   <span class="nav-label">Pqrs</span>
                </a>
            </div>
        </nav>
    </header>

    <!--contenido-->

    



<script src="../scripts/menu.js"></script>
</body>

</html>
