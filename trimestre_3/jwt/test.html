<!DOCTYPE html>
<html>
<head>
    <title>Probar Login</title>
</head>
<body>
    <h2>Probar Login JWT</h2>
    <button onclick="probarLogin()">Probar Login con admin</button>
    <div id="resultado" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        async function probarLogin() {
            try {
                // 1. Hacer la petición al servidor
                const respuesta = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'Admin1'  // 👈 CORREGIDO: 'A' mayúscula
                    })
                });
                
                // 2. Convertir la respuesta a JSON
                const datos = await respuesta.json();
                
                // 3. Mostrar el resultado en la página
                document.getElementById('resultado').innerHTML = 
                    '<h3>Respuesta del servidor:</h3>' +
                    '<pre>' + JSON.stringify(datos, null, 2) + '</pre>';
                    
            } catch (error) {
                // 4. Si hay error, mostrarlo
                document.getElementById('resultado').innerHTML = 
                    '<p style="color: red;">Error: ' + error + '</p>';
            }
        }
    </script>
</body>
</html>
